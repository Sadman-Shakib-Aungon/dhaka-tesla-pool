services:
  db:
    image: postgres:16-alpine
    container_name: dhaka-tesla-pool-db
    environment:
      POSTGRES_DB: dhaka_tesla_pool
      POSTGRES_USER: pool_user
      POSTGRES_PASSWORD: pool_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pool_user -d dhaka_tesla_pool"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://pool_user:pool_password@db:5432/dhaka_tesla_pool?schema=public
      PORT: 4000
      JWT_SECRET: docker-development-secret-change-in-production
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
